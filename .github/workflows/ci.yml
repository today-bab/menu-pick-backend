name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
      # 테스트별 결과(통과·실패·건너뜀)를 실행 요약에 표로 남기고, 실패한 테스트는 코드 줄에 표시한다.
      # Docker가 필요한 Valkey 통합 테스트가 건너뛰어지지 않았는지도 여기서 확인한다
      - name: 테스트 결과 요약
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/test-results/test/TEST-*.xml
          # check run을 따로 만들지 않아 checks 쓰기 권한이 필요 없다
          annotate_only: true
          detailed_summary: true
          include_passed: true
          include_skipped: true
          require_tests: true
      - name: 테스트 HTML 리포트 올리기
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # main에 push되면 커밋 SHA를 태그로 이미지를 올린다
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # 패키지를 이 저장소와 연결한다
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # gitops 저장소의 이미지 태그를 바꾸면 Argo CD가 새 이미지로 배포한다
  deploy:
    needs: image
    runs-on: ubuntu-latest
    # 연달아 push돼도 태그 갱신 커밋이 서로 부딪히지 않게 한 번에 하나씩
    concurrency: gitops-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          repository: today-bab/menu-pick-gitops
          # menu-pick-gitops에만 쓸 수 있는 deploy key
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - name: 이미지 태그 갱신
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '(.images[] | select(.name == "${{ env.IMAGE }}")).newTag = strenv(TAG)' \
            services/menu-pick-backend/kustomization.yaml
      - name: 커밋·push
        run: |
          if git diff --quiet; then
            echo "이미 같은 태그라 커밋하지 않음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: menu-pick-backend ${GITHUB_SHA::7}" \
            -m "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git push
