name: Conventions

# docs/git-conventions.md의 브랜치 이름·PR 제목·이슈 연결 규칙을 검사한다
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 규칙 검사
        # PR 제목과 본문은 사용자가 쓴 값이라 스크립트에 직접 넣지 않고 환경변수로 넘긴다
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          TYPES: feat|fix|refactor|test|docs|chore|ci|build
        run: |
          failed=0

          if [[ ! "$BRANCH" =~ ^($TYPES)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::브랜치 이름이 '<타입>/<이슈번호>-<짧은-설명>' 형식이 아닙니다: $BRANCH"
            failed=1
          fi

          if [[ ! "$TITLE" =~ ^($TYPES):\ .+ ]]; then
            echo "::error::PR 제목이 '<타입>: <요약>' 형식이 아닙니다: $TITLE"
            failed=1
          fi

          if ! grep -qiE '(^|[^[:alnum:]])closes #[0-9]+' <<< "$BODY"; then
            echo "::error::PR 본문에 'Closes #<이슈번호>'가 없습니다"
            failed=1
          fi

          exit $failed
