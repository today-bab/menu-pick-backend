spring.application.name=menu-pick-backend

# 로컬 개발용 비밀값 (git 제외). 실제 환경변수가 있으면 그 값이 우선한다.
spring.config.import=optional:file:.env[.properties]

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

kakao.rest-key=${KAKAO_REST_KEY:}
kakao.base-url=https://dapi.kakao.com
kakao.connect-timeout=2s
kakao.read-timeout=3s
kakao.radius-meters=1000
kakao.max-pages=3
# 반경을 3×3 구역으로 나눠 구역마다 검색한다 (카카오는 한 번에 45곳까지만 주므로). 캐시 미스 한 번에 최대 27번 호출
kakao.grid-size=3

# 근처 음식점 목록은 Valkey(Redis 호환)에 두어 모든 Pod가 함께 쓴다.
# 접속 주소는 spring.data.redis.host (환경변수 SPRING_DATA_REDIS_HOST, 기본 localhost)
spring.cache.type=redis
# 캐시 값 형식이 바뀌면 버전을 올린다 (CachingRestaurantClient.CACHE_NAME과 같게)
spring.cache.cache-names=nearby-restaurants-v2
spring.cache.redis.time-to-live=10m
# 캐시 적중률 지표(cache_gets_total 등)를 남긴다
spring.cache.redis.enable-statistics=true
# Valkey가 응답하지 않으면 오래 기다리지 않고 캐시 없이 카카오를 부른다 (기본 60초)
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms

# Actuator는 별도 포트로만 연다. 외부 공개(터널)는 8080만 연결하므로 지표가 인터넷에 노출되지 않는다.
#   8081/actuator/health/liveness, /actuator/health/readiness : k8s 프로브
#   8081/actuator/prometheus : Prometheus 수집
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# 모든 지표에 앱 이름을 붙인다 (Grafana JVM·Spring Boot 대시보드가 application 라벨로 앱을 고름)
management.metrics.tags.application=${spring.application.name}
