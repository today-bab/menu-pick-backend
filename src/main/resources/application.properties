spring.application.name=menu-pick-backend

# 로컬 개발용 비밀값 (git 제외). 실제 환경변수가 있으면 그 값이 우선한다.
spring.config.import=optional:file:.env[.properties]

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

kakao.rest-key=${KAKAO_REST_KEY:}
kakao.base-url=https://dapi.kakao.com
kakao.connect-timeout=2s
kakao.read-timeout=3s
kakao.radius-meters=1000
kakao.max-pages=3

spring.cache.cache-names=nearby-restaurants
# recordStats: 캐시 적중률 지표(cache_gets_total 등)를 남긴다
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m,recordStats

# Actuator는 별도 포트로만 연다. 외부 공개(터널)는 8080만 연결하므로 지표가 인터넷에 노출되지 않는다.
#   8081/actuator/health/liveness, /actuator/health/readiness : k8s 프로브
#   8081/actuator/prometheus : Prometheus 수집
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
